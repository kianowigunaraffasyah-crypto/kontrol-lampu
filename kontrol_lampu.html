<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kontrol Lampu ESP32</title>
    
    <!-- Library MQTT yang lebih stabil -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            text-align: center;
            background-color: #1e1e2f;
            color: white;
            padding-top: 40px;
            margin: 0;
        }
        .card {
            background: #2b2b40;
            display: inline-block;
            padding: 35px 40px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
        }
        h2 {
            margin-top: 0;
            margin-bottom: 25px;
            color: #e0e0e0;
        }
        .lampu-container {
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
            position: relative;
        }
        .lampu {
            width: 80px;
            height: 80px;
            background: #555;
            border-radius: 50%;
            margin: 0 auto;
            position: relative;
            transition: all 0.4s ease;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
        }
        .lampu.nyala {
            background: #ffec8b;
            box-shadow: 
                0 0 20px #ffec8b,
                0 0 40px #ffd700,
                0 0 60px #ffaa00,
                inset 0 0 20px #fff;
        }
        .lampu::after {
            content: "";
            position: absolute;
            bottom: -18px;
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 18px;
            background: #444;
            border-radius: 0 0 6px 6px;
        }
        .lampu.nyala::after {
            background: #666;
        }
        .status {
            font-weight: bold;
            font-size: 18px;
            color: #ffca28;
            margin: 15px 0 25px;
        }
        .btn {
            padding: 14px 30px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            margin: 8px;
            cursor: pointer;
            color: white;
            transition: transform 0.15s, opacity 0.15s;
        }
        .btn:active {
            transform: scale(0.95);
            opacity: 0.9;
        }
        .btn-on { background-color: #4CAF50; }
        .btn-off { background-color: #f44336; }
    </style>
</head>
<body>
<div class="card">
    <h2>Kontrol Lampu ESP32</h2>

    <div class="lampu-container">
        <div id="gambarLampu" class="lampu"></div>
    </div>

    <p>Status Lampu: <span id="teksStatus" class="status">MENGHUBUNGKAN...</span></p>

    <button class="btn btn-on" onclick="kirim('ON')">NYALAKAN</button>
    <button class="btn btn-off" onclick="kirim('OFF')">MATIKAN</button>
</div>

<script>
    const gambarLampu = document.getElementById("gambarLampu");
    const teksStatus  = document.getElementById("teksStatus");

    // Koneksi ke HiveMQ menggunakan WSS (aman & stabil di HP)
    const client = mqtt.connect('wss://broker.hivemq.com:8884/mqtt');

    client.on('connect', function () {
        console.log('Terhubung ke MQTT');
        teksStatus.innerText = "SIAP";
        teksStatus.style.color = "#ffca28";
        
        // Subscribe ke status lampu
        client.subscribe('rumah/lampu/status');
    });

    client.on('message', function (topic, message) {
        const msg = message.toString();
        console.log('Pesan masuk:', msg);

        if (msg === 'ON') {
            gambarLampu.classList.add("nyala");
            teksStatus.innerText = "MENYALA";
            teksStatus.style.color = "#4CAF50";
        } 
        else if (msg === 'OFF') {
            gambarLampu.classList.remove("nyala");
            teksStatus.innerText = "MATI";
            teksStatus.style.color = "#f44336";
        }
    });

    client.on('error', function (err) {
        console.log('Error:', err);
        teksStatus.innerText = "GAGAL TERHUBUNG";
        teksStatus.style.color = "#f44336";
    });

    client.on('close', function () {
        teksStatus.innerText = "KONEKSI TERPUTUS";
        teksStatus.style.color = "#f44336";
    });

    function kirim(pesan) {
        if (!client.connected) {
            alert("Belum terhubung ke server!");
            return;
        }
        client.publish('rumah/lampu/kontrol', pesan);
        console.log('Mengirim:', pesan);
    }
</script>
</body>
</html>
