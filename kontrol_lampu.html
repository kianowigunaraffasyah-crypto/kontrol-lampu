<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontrol Lampu IoT</title>
    
    <!-- Library MQTT Paho -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1e1e2f;
            color: white;
            text-align: center;
            padding-top: 50px;
            margin: 0;
        }
        .card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 30px;
            display: inline-block;
            width: 280px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }
        .icon-lampu {
            font-size: 70px;
            color: #888888;
            transition: all 0.3s ease;
            margin-bottom: 10px;
        }
        .lampu-on {
            color: #38ef7d;
            text-shadow: 0 0 20px #38ef7d;
        }
        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin: 5px;
            color: white;
        }
        .btn-on { background: #38ef7d; color: #1e1e2f; }
        .btn-off { background: #eb3941; }
    </style>

    <script>
        // Menggunakan server EMQX pada port 8083
        var idAcak = "client_web_" + Math.floor(Math.random() * 10000);
        var client = new Paho.MQTT.Client("broker.emqx.io", 8083, idAcak);

        client.connect({
            onSuccess: function () {
                var status = document.getElementById("status");
                status.innerText = "● Terhubung Ke Server";
                status.style.color = "#38ef7d";
            }
        });

        function kirimPerintah(pesan) {
            var message = new Paho.MQTT.Message(pesan);
            message.destinationName = "esp32/lampu/kontrol";
            client.send(message);

            // Mengubah warna ikon lampu saat tombol ditekan
            var icon = document.getElementById("iconLampu");
            if (pesan === "ON") {
                icon.className = "icon-lampu lampu-on"; // Warna Hijau
            } else {
                icon.className = "icon-lampu"; // Warna Abu-abu
            }
        }
    </script>
</head>
<body>

    <div class="card">
        <div id="iconLampu" class="icon-lampu">💡</div>
        <h3>Kontrol Lampu ESP32</h3>
        <p id="status" style="color: #ff6b6b; font-weight: bold;">● Menghubungkan...</p>
        
        <button class="btn btn-on" onclick="kirimPerintah('ON')">ON</button>
        <button class="btn btn-off" onclick="kirimPerintah('OFF')">OFF</button>
    </div>

</body>
</html>
