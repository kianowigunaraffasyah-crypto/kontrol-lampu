<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kontrol Lampu Jarak Jauh</title>
    <!-- Library untuk mengirim sinyal internet dari browser -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>

    <script>
        var idAcak = "client_web_" + Math.floor(Math.random() * 10000);
        var client = new Paho.MQTT.Client("broker.hivemq.com", 8000, idAcak);

        client.connect({
            onSuccess: function () {
                document.getElementById("status").innerText = "Terhubung ke Internet!";
                document.getElementById("status").style.color = "green";
            }
        });

        function kirimPerintah(pesan) {
            var message = new Paho.MQTT.Message(pesan);
            message.destinationName = "esp32/lampu/kontrol";
            client.send(message);
        }
    </script>
</head>
<body style="text-align:center; font-family:Arial; margin-top:50px;">
    <h2>Kontrol Lampu Jarak Jauh</h2>
    <p id="status" style="color:red;">Menghubungkan ke server...</p>
    
    <div style="margin-top:30px;">
        <button onclick="kirimPerintah('ON')" style="padding:15px 30px; background-color:green; color:white; font-size:18px; border:none; border-radius:5px; margin:10px;">NYALAKAN (ON)</button>
        <button onclick="kirimPerintah('OFF')" style="padding:15px 30px; background-color:red; color:white; font-size:18px; border:none; border-radius:5px; margin:10px;">MATIKAN (OFF)</button>
    </div>
</body>
</html>
